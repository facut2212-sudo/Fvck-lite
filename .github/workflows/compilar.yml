name: Compilar Ghost Client a EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar codigo fuente
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Compilar script a EXE
      run: |
        pyinstaller --noconsole --onefile --name="FvckLite" "fvck lite"

    - name: Subir ejecutable como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: FvckLite-Executable
        path: dist/FvckLite.exe
